services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    ports:
      - "4200:4200"
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  web:
    image: nginx:1.23.3-alpine
    ports:
      - "8091:80"
    volumes:
      - laravel-app-code:/var/www:ro
    depends_on:
      - laravel-api
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            index index.php index.html;
            root /var/www/public;
            location / {
                try_files $$uri /index.php?$$args;
            }
            location ~ \.php$$ {
                fastcgi_split_path_info ^(.+\.php)(/.+)$$;
                fastcgi_pass laravel-api:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                fastcgi_param PATH_INFO $$fastcgi_path_info;
            }
        }
        EOF
        exec /docker-entrypoint.sh nginx -g 'daemon off;'

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
